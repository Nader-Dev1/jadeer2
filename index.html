.login{min-height:100vh;display:grid;place-items:center;padding:20px}.lbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--mar);border-radius:6px;padding:32px}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.k{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}.k b{display:block;font-size:28px;color:var(--mar)}.k span{color:var(--mut);font-size:13px}

body{font-family:Cairo,"IBM Plex Sans Arabic",Tahoma,sans-serif}
:root{--bg:#f7f3f5;--rad:14px;--sh:0 1px 2px rgba(39,37,38,.05),0 8px 24px -12px rgba(103,2,53,.18)}

.lg{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.lgbtn{width:100%;padding:13px;font-size:16px;margin-top:6px}
.demo{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}.chip{background:var(--tint);color:var(--mar);border:0;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
.app2{min-height:100vh}.sb{display:none}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(120deg,#670235,#3d0120);color:#fff}.top .logo{color:#fff}.top .logo b{font-size:20px}.top .logo i{color:#e8b9cf}

main{padding:16px 14px 96px}

.bn button{flex:1 0 66px;position:relative;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;cursor:pointer}.bn button.on{color:var(--mar);font-weight:700}

.app2{display:grid;grid-template-columns:250px 1fr;align-items:start}.top,.bn{display:none}.sb{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:24px 14px;background:linear-gradient(180deg,#3d0120,#272526);color:#efeced}.sb .logo{color:#fff;margin:0 0 26px 6px}.sb .logo i{color:#e8b9cf}.sb>button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#d9c0cc;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer}.sb>button.on{background:rgba(255,255,255,.14);color:#fff}.sb>button em{margin-inline-start:auto}.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}.me .av{background:rgba(255,255,255,.18);color:#fff}.me .out2{margin-inline-start:auto}main{padding:32px;max-width:1100px}.th{height:calc(100vh - 120px)}}

.pn{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px}.pn h3{margin-bottom:10px}
.er{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.er:last-child{border:0}
.ai{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.ai:last-child{border:0}
.wk{display:flex;align-items:flex-end;gap:10px;height:130px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--mut)}.wk i{display:block;width:100%;max-width:36px;background:linear-gradient(#670235,#b3809a);border-radius:6px 6px 0 0}

<script>
const D=new Date(),Y=D.getFullYear(),Mo=D.getMonth(),pad=n=>String(n).padStart(2,'0'),iso=d=>`${Y}-${pad(Mo+1)}-${pad(d)}`,TD=D.getDate(),T=iso(TD);
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b},nowT=()=>pad(new Date().getHours())+':'+pad(new Date().getMinutes());
const F=[['name','الاسم'],['no','الرقم الوظيفي'],['phone','رقم الجوال'],['dept','القسم'],['mgr','المدير المباشر'],['title','المسمى الوظيفي'],['nat','الجنسية'],['addr','العنوان'],['salary','الراتب الأساسي','number'],['ins','بداية الدوام','time'],['outs','نهاية الدوام','time'],['cs','بداية العقد','date'],['ce','نهاية العقد','date'],['otAmt','قيمة الإضافي','number'],['otWhy','سبب الإضافي'],['user','اسم المستخدم'],['pass','كلمة المرور']];
const S={u:null,tab:'dash',ch:1001,form:null,emps:[
{id:1001,name:'سلطان العتيبي',no:'1001',phone:'0551234567',dept:'العمليات',mgr:'أحمد المطيري',title:'منسق شحن',nat:'سعودي',addr:'الرياض - حي النزهة',salary:6000,ins:'08:00',outs:'17:00',cs:'2026-01-01',ce:'2026-12-31',otAmt:300,otWhy:'تحميل شحنة عاجلة',user:'sultan',pass:'1234'},
{id:1002,name:'محمد الشهري',no:'1002',phone:'0509876543',dept:'المستودعات',mgr:'أحمد المطيري',title:'أمين مستودع',nat:'مصري',addr:'الرياض - حي السلي',salary:4500,ins:'08:00',outs:'17:00',cs:'2026-03-01',ce:'2026-11-20',otAmt:0,otWhy:'',user:'mohammed',pass:'1234'},
{id:1003,name:'خالد القحطاني',no:'1003',phone:'0561112233',dept:'النقل',mgr:'سلطان العتيبي',title:'سائق',nat:'سعودي',addr:'الرياض - حي العزيزية',salary:4000,ins:'07:00',outs:'16:00',cs:'2026-02-01',ce:'2027-01-31',otAmt:150,otWhy:'رحلة خارج الجدول',user:'khaled',pass:'1234'}],
att:{},tasks:[{id:1,emp:1001,t:'تسليم بيان الشحنة لجمارك الرياض',pr:'عالية',due:T,st:'قيد التنفيذ'},{id:2,emp:1002,t:'جرد مستودع B',pr:'متوسطة',due:T,st:'جديدة'}],
reqs:[{id:1,emp:1002,type:'سلفة',amt:1000,why:'ظرف عائلي',st:'بانتظار الموافقة'},{id:2,emp:1003,type:'إجازة',from:iso(TD+3),to:iso(TD+5),why:'سفر',st:'بانتظار الموافقة'}],
chat:[{emp:1001,from:'admin',t:'صباح الخير، لا تنسَ بيان الشحنة اليوم',tm:'08:05'}],ded:{}};
S.emps.forEach(e=>{for(let d=1;d<TD;d++){const w=new Date(Y,Mo,d).getDay();if(w>4||(e.id==1002&&d%6==3))continue;S.att[e.id+'|'+iso(d)]={i:e.id==1002&&d%4==0?'08:'+(20+d%20):e.ins.slice(0,4)+(d%9),o:e.outs.slice(0,4)+(d%9)}}});
S.att['1001|'+T]={i:'07:58'};S.att['1002|'+T]={i:'08:25'};
const emp=id=>S.emps.find(e=>e.id==id),A=(e,d)=>S.att[e.id+'|'+d];
const excused=(e,d)=>S.reqs.some(r=>r.emp==e.id&&r.type=='إجازة'&&r.st=='تمت الموافقة'&&r.from<=d&&d<=r.to);
function status(e,d){const a=A(e,d),w=new Date(d).getDay();if(!a)return w>4?['راحة','']:excused(e,d)?['إجازة','']:d>T?['—','']:d==T?['لم يسجل بعد','warn']:['غائب','bad'];const l=mins(a.i)-mins(e.ins)-10;if(!a.o&&d<T)return['تسجيل ناقص','warn'];return l>0?['متأخر '+(l+10)+' د','warn']:['حاضر','ok']}
const tg=(s)=>`<span class="tag ${s[1]}">${s[0]}</span>`;
function absent(e){let n=0;for(let d=1;d<TD;d++){const k=iso(d);if(new Date(k).getDay()<=4&&!A(e,k)&&!excused(e,k))n++}return n}
const adv=e=>S.reqs.filter(r=>r.emp==e.id&&r.type=='سلفة'&&r.st=='تمت الموافقة').reduce((s,r)=>s+r.amt,0);
const net=e=>{const x=S.ded[e.id]||{};return +e.salary+ +e.otAmt-(+x.inst||0)-(+x.v||0)};
const nm=id=>emp(id).name;
function login(){return `<div class="login"><div class="lbox"><div class="logo"><b>JADEER <i>4</i></b><small>LOGISTICS</small></div><h2 style="margin:22px 0 14px">تسجيل الدخول</h2><label>اسم المستخدم</label><input id="lu" autocomplete="username"><label style="margin-top:10px">كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"><p id="le" class="hint" style="color:var(--bad);min-height:22px"></p><button class="b" style="width:100%" data-a="login">دخول</button><p class="hint" style="margin-top:16px">نسخة تجريبية. الأدمن: admin / admin. موظف: sultan / 1234</p></div></div>`}
const NAV=[['dash','لوحة التحكم'],['emps','الموظفون'],['att','الحضور والتقارير'],['tasks','المهام'],['reqs','الطلبات'],['pay','مسير الرواتب'],['rep','التقارير'],['chat','الرسائل']],ENAV=[['home','حضوري ومهامي'],['myreq','طلباتي'],['chat','الرسائل']];
function shell(body){const nav=S.u.admin?NAV:ENAV;return `<div class="app"><nav class="side"><div class="logo"><b>JADEER <i>4</i></b><small>LOGISTICS</small></div>${nav.map(n=>`<button class="${S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}">${n[1]}</button>`).join('')}<button class="out" data-a="out">خروج</button></nav><main>${body}</main></div>`}
function dash(){const as=S.emps.map(e=>status(e,T)[0]);const c=f=>as.filter(f).length,p=S.reqs.filter(r=>r.st=='بانتظار الموافقة').length,tk=S.tasks.filter(t=>t.st!='تمت المهمة');
const soon=S.emps.filter(e=>(new Date(e.ce)-D)/864e5<60);
